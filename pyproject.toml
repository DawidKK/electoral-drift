[project]
name = "electoral-drift"
version = "0.1.0"
description = "Monorepo for analyzing electoral drift across Polish counties."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "electoral-api",
    "electoral-db",
    "electoral-ingestion",
]

[tool.uv]
package = false

[tool.uv.sources]
electoral-api = { workspace = true }
electoral-db = { workspace = true }
electoral-ingestion = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/db",
    "packages/ingestion",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/db/tests",
    "packages/ingestion/tests",
]
pythonpath = [
    "apps/api",
    "packages/db",
    "packages/ingestion",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = [
    "apps/api",
    "packages/db",
]
exclude = [
    "^packages/ingestion/",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
